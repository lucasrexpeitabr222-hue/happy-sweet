<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Sweet – Confeitaria & Salgados Artesanais</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff0f6;--card:#fff;--ink:#4a1530;--muted:#8a4b69;--pink:#ff4f9a;--pink2:#ffd1e6;--on:#fff;--line:#ffc2dc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0f1d;--card:#3a1628;--ink:#ffe6f1;--muted:#e7a9c6;--pink:#ff6fb0;--pink2:#5a2040;--line:#6b2a4b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a0f1d;--card:#3a1628;--ink:#ffe6f1;--muted:#e7a9c6;--pink:#ff6fb0;--pink2:#5a2040;--line:#6b2a4b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{line-height:1.1;margin:0 0 .4em}h1{font-size:clamp(2.2rem,7vw,3.8rem);font-weight:800}h2{font-size:1.7rem}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pink);color:var(--on)}
.bar{max-width:980px;margin:auto;display:flex;align-items:center;gap:8px;padding:8px 14px}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.3rem;color:var(--on);text-decoration:none}.logo svg{width:34px;height:38px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}nav a{color:var(--on);text-decoration:none;padding:6px 12px;border-radius:99px;white-space:nowrap;font-weight:600}
nav a.on{background:var(--on);color:var(--pink)}
.badge{background:var(--on);color:var(--pink);border-radius:99px;padding:0 7px;font-size:.8rem;margin-left:4px}
main{max-width:980px;margin:auto;padding:18px 14px 60px}
.hero{display:grid;gap:10px;align-items:center;justify-items:center;text-align:center;padding:20px 0 30px}
.hero svg{width:min(60vw,260px);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(3deg)}}
.btn{display:inline-block;background:var(--pink);color:var(--on);border:0;border-radius:99px;padding:11px 24px;font:700 1rem inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--pink2);color:var(--ink)}.btn:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px}
.prod{display:flex;flex-direction:column;gap:6px}.prod .em{font-size:2.4rem}.prod h3{font-size:1.1rem}
.price{color:var(--pink);font-weight:800}.muted{color:var(--muted);font-size:.9rem}
.qty{display:flex;align-items:center;gap:10px;margin-top:auto}.qty button{width:34px;height:34px;border-radius:50%;border:0;background:var(--pink2);color:var(--ink);font-size:1.2rem;font-weight:800;cursor:pointer}
.sec{margin:26px 0 10px}
.tile{text-decoration:none;color:var(--ink);text-align:center}.tile .em{font-size:2.6rem;display:block}
.rv{opacity:0;transform:translateY(24px);transition:.6s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.hero svg{animation:none}}
label{display:block;font-weight:600;margin:10px 0 4px}
input,textarea{width:100%;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.row{grid-template-columns:1fr}}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.pay{display:flex;gap:10px;flex-wrap:wrap}.pay label{flex:1;min-width:140px;border:2px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;margin:0;background:var(--card)}
.pay input{width:auto;margin-right:6px}
.note{background:var(--pink2);border-radius:14px;padding:10px 14px;margin:10px 0}
.err{color:#d11a5b;font-weight:700}
footer{text-align:center;color:var(--muted);padding:20px}
.rv{transform:none;translate:var(--tx,0) 26px;opacity:0;transition:opacity .7s,translate .8s cubic-bezier(.2,.8,.2,1),rotate .8s}.rv.in{translate:0 var(--oy,0);opacity:1}
.asym{grid-template-columns:repeat(6,1fr);gap:18px;align-items:start}.asym>.rv{grid-column:span 2}.asym>.rv:nth-child(4n+1),.asym>.rv:nth-child(4n){grid-column:span 4}
.asym>.rv:nth-child(4n+1){rotate:-1.2deg;--tx:-50px}.asym>.rv:nth-child(4n+2){rotate:1.6deg;--tx:50px;--oy:22px}.asym>.rv:nth-child(4n+3){rotate:-1.8deg;--tx:-50px;--oy:-8px}.asym>.rv:nth-child(4n){rotate:1deg;--tx:50px;--oy:16px}
@media(max-width:640px){.asym{grid-template-columns:1fr}.asym>.rv{grid-column:auto!important}.asym>.rv:nth-child(even){margin-left:28px}.asym>.rv:nth-child(odd){margin-right:28px}}
.card{position:relative;overflow:hidden}.card::after{content:"";position:absolute;inset:0;background:radial-gradient(190px circle at var(--mx,50%) var(--my,-50%),rgba(255,79,154,.25),transparent 70%);opacity:0;transition:.3s;pointer-events:none}.card:hover::after{opacity:1}
.hero{grid-template-columns:1.25fr .75fr;justify-items:start;text-align:left;position:relative;padding:36px 0 40px}.hero>*{position:relative;z-index:1}.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.hero .hm{width:min(70vw,300px);justify-self:center;rotate:4deg}
@media(max-width:640px){.hero{grid-template-columns:1fr}}
.w{display:inline-block;opacity:0;translate:0 .7em;animation:wi .7s cubic-bezier(.2,.8,.2,1) forwards var(--d)}@keyframes wi{to{opacity:1;translate:0 0}}
.fill{font-size:clamp(1.6rem,5vw,2.8rem);font-weight:800;line-height:1.15;margin:44px 0 20px 6%;max-width:18em}.fill span{color:var(--line);transition:color .3s}.fill span.on{color:var(--ink)}
.btn{transition:transform .5s cubic-bezier(.34,1.9,.64,1)}.btn:hover{transform:scale(1.1)}.btn:active{transform:scale(.94)}
#who{position:relative}.bar{flex-wrap:wrap}.bar>.logo{margin-right:auto}nav{order:3;flex-basis:100%}@media(min-width:760px){nav{order:0;flex-basis:auto}}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border:0;border-radius:12px;padding:5px 10px 5px 6px;font-family:inherit;font-weight:600;font-size:1rem;cursor:pointer;text-decoration:none}.chip i{width:28px;height:28px;border-radius:50%;background:#c2185b;color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}.chip small{color:var(--muted)}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px;display:grid;min-width:170px}.menu[hidden]{display:none}.menu a,.menu button{padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;background:none;border:0;text-align:left;font:inherit;cursor:pointer}.menu a:hover,.menu button:hover{background:var(--pink2)}
footer a{color:var(--pink);font-weight:700}
#rg{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid var(--pink);border-radius:50%;pointer-events:none;z-index:60;transition:width .2s,height .2s,margin .2s,background .2s;display:none}@media(hover:hover) and (pointer:fine){#rg{display:block}}#rg.big{width:56px;height:56px;margin:-28px 0 0 -28px;background:rgba(255,79,154,.18)}
@media(prefers-reduced-motion:reduce){.rv{translate:none;opacity:1;transition:none}.w{animation:none;opacity:1;translate:none}#rg{display:none!important}}
main{overflow-x:clip}
.ph{aspect-ratio:4/3;border-radius:16px;background:var(--pink2);display:grid;place-items:center;overflow:hidden;font-size:2.6rem;margin-bottom:8px}.ph img{width:100%;height:100%;object-fit:cover}
.asym>.rv:nth-child(even){transition-delay:.08s}
@media(max-width:640px){
h1{font-size:2.1rem}main{padding:14px 12px 50px}
.hero{padding:14px 0 18px;gap:4px}.hero .hm{width:130px;justify-self:end;margin-top:-6px;rotate:3deg}
.fill{margin:26px 0 12px;font-size:1.45rem}
.asym{grid-template-columns:repeat(2,1fr);gap:12px}
.asym>.rv:nth-child(n){grid-column:auto;rotate:0deg;--oy:0px;margin:0}
.asym>.rv:nth-child(odd){--tx:-24px;rotate:-.8deg}.asym>.rv:nth-child(even){--tx:24px;rotate:.8deg;margin-top:16px}
.card{padding:12px;border-radius:18px}.prod h3{font-size:1rem}.ph{font-size:2rem;border-radius:12px}
.logo{font-size:1.1rem}.bar{padding:6px 10px}
}
@media(min-width:641px){.asym{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.asym>.rv:nth-child(n){grid-column:auto;rotate:0deg;--oy:0px;margin:0}.asym>.rv:nth-child(odd){--tx:-30px}.asym>.rv:nth-child(even){--tx:30px;margin-top:12px}}
@media(max-width:640px){.asym>.rv:nth-child(n){rotate:0deg;margin:0;--oy:0px}.asym>.rv:nth-child(odd){--tx:-16px}.asym>.rv:nth-child(even){--tx:16px}}
@media(min-width:641px){.asym{grid-template-columns:repeat(6,1fr);gap:16px}.asym>.rv:nth-child(n){grid-column:span 2;rotate:0deg;margin:0;--oy:0px}.asym>.rv:nth-child(4n+1),.asym>.rv:nth-child(4n){grid-column:span 4}.asym>.rv:nth-child(odd){--tx:-30px}.asym>.rv:nth-child(even){--tx:30px}}
@media(max-width:640px){.asym{grid-template-columns:repeat(2,1fr)}.asym>.rv:nth-child(n){rotate:0deg;margin:0;--oy:0px}.asym>.rv:nth-child(4n+1),.asym>.rv:nth-child(4n){grid-column:span 2!important}.asym>.rv:nth-child(odd){--tx:-16px}.asym>.rv:nth-child(even){--tx:16px}}
.tg{border:0;background:var(--card);border-radius:12px;width:40px;height:40px;font-size:1.2rem;cursor:pointer}.line{flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="m" viewBox="0 0 100 112">
<path d="M22 62h56l-7 42a6 6 0 0 1-6 5H35a6 6 0 0 1-6-5z" fill="#ffb347"/>
<path d="M34 64l3 44M50 64v45M66 64l-3 44" stroke="#e8902a" stroke-width="3"/>
<path d="M14 62c-4-14 8-20 14-22-6-14 8-26 22-22 14-6 30 4 24 22 8 2 18 8 8 22z" fill="#ff7ab8"/>
<path d="M32 44c8 4 14 2 18-4M54 36c6 6 14 6 20 2" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>
<circle cx="50" cy="12" r="8" fill="#e11d48"/><path d="M50 5q4-6 9-5" stroke="#3f8f3f" stroke-width="3" fill="none"/>


<ellipse cx="29" cy="60" rx="6" ry="4" fill="#ff4f9a" opacity=".6"/><ellipse cx="71" cy="60" rx="6" ry="4" fill="#ff4f9a" opacity=".6"/>
<path d="M42 59q8 9 16 0" stroke="#4a1530" stroke-width="3" fill="none" stroke-linecap="round"/></symbol></svg>

<header><div class="bar"><a class="logo" id="lg" href="#inicio"></a><nav id="nav"></nav><button id="tg" class="tg" data-a="tema" aria-label="Mudar tema"></button><div id="who"></div></div></header>
<div id="rg"></div><main id="app"></main>
<footer id="ft"></footer>

<script>
// ====== CONFIGURE AQUI ======
var ZAP = "5581983371014";            // WhatsApp da loja com DDI+DDD, ex.: 5581900000000
var PIX = "";            // Chave Pix da loja
var INSTA = "happysweeett";          // Instagram da loja, só o nome de usuário, ex.: happysweet
var PRECOS = {copos:14, minivulcao:16, vulcao:40, brownie:10, coxinha:0};
var FOTOS = {}; // fotos dos produtos, ex.: "copos|Abacaxi":"fotos/abacaxi.jpg"
function ph(p){var u=FOTOS[p.cat+"|"+p.nome];return '<div class="ph">'+(u?'<img src="'+esc(u)+'" alt="'+esc(p.nome)+'" loading="lazy">':CATS[p.cat].e)+'</div>'}
var PX = {"copos|Abacaxi":12,"copos|Maracujá Branco":12,"copos|Maracujá Preto":12,"coxinha|Carne de Sol":10,"coxinha|Charque":10,"coxinha|Costela":12,"coxinha|Frango":7,"coxinha|Frango com Catupiry":8,"coxinha|Frango com Cream Cheese":10}; // preço por unidade (0 = a combinar)
// ============================
var CATS = {
 copos:{t:"Copos da Felicidade",e:"🥤",n:["Abacaxi","Maracujá Branco","Maracujá Preto","Brownie","Bombom de Morango"]},
 minivulcao:{t:"Mini Vulcão",e:"🌋",n:["Maracujá","Ninho com Nutella","Ninho","Chocolate com Nutella","Brincadeira","Bem Casado","Delícia de Abacaxi","Geleia de Morango"]},
 vulcao:{t:"Vulcão de 1 kg",e:"🍰",n:["Bem Casado","Chocolate","Ninho"]},
 brownie:{t:"Brownie",e:"🍫",n:["Bem Casado","Brigadeiro"]},
 coxinha:{t:"Coxinha",e:"🍗",n:["Costela","Frango","Frango com Catupiry","Frango com Cream Cheese","Carne de Sol","Charque"]}};
var PAGES = {inicio:"Início",copos:"Copos",vulcoes:"Vulcões",brownies:"Brownies",coxinhas:"Coxinhas",pedidos:"Pedidos",carrinho:"Carrinho",conta:"Conta"};
var GROUP = {copos:["copos"],vulcoes:["minivulcao","vulcao"],brownies:["brownie"],coxinhas:["coxinha"]};
var PROD = {};
Object.keys(CATS).forEach(function(c){CATS[c].n.forEach(function(n,i){PROD[c+i]={id:c+i,cat:c,nome:n,preco:PX[c+"|"+n]||PRECOS[c]||0}})});

var mem = {};
function ld(k,d){try{var v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:d}
function sv(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var cart=ld("hs_cart",{}), user=ld("hs_user",null), orders=ld("hs_orders",[]);
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function brl(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function pr(p){return p.preco?brl(p.preco):"preço a combinar"}
function items(){return Object.keys(cart).filter(function(k){return cart[k]>0&&PROD[k]}).map(function(k){return{p:PROD[k],q:cart[k]}})}
function total(){var l=items(),t=0,ok=true;l.forEach(function(i){if(i.p.preco)t+=i.p.preco*i.q;else ok=false});return{t:t,ok:ok}}
function totTxt(){var x=total();return x.ok?brl(x.t):(x.t?brl(x.t)+" + itens a combinar":"a confirmar no ZAP")}
function count(){return items().reduce(function(a,i){return a+i.q},0)}
var flash="",ST=ld("hs_stock",{}),LOG=ld("hs_log",[]);
function adr(u){u=u||{};return '<div class="row"><div><label>Rua</label><input name="rua" value="'+esc(u.rua||"")+'"></div><div><label>Número</label><input name="num" value="'+esc(u.num||"")+'"></div></div><div class="row"><div><label>Bairro</label><input name="bairro" value="'+esc(u.bairro||"")+'"></div><div><label>Complemento</label><input name="comp" value="'+esc(u.comp||"")+'"></div></div><label>Ponto de referência</label><input name="ref" value="'+esc(u.ref||"")+'">'}
function setQ(id,d){if(!user){flash="Crie sua conta para começar a pedir 💖";location.hash="conta";return}if(d>0&&ST[id]!==undefined&&(cart[id]||0)>=ST[id])return;cart[id]=Math.max(0,(cart[id]||0)+d);sv("hs_cart",cart);route(true)}

function card(p){var q=cart[p.id]||0,s=ST[p.id],out=s!==undefined&&s<=0;return '<div class="card prod rv">'+ph(p)+'<h3>'+esc(p.nome)+'</h3><span class="muted">'+CATS[p.cat].t+'</span><span class="price">'+pr(p)+'</span>'+(s!==undefined&&s<=5?'<span class="muted">'+(out?"Esgotado":"Restam "+s)+'</span>':"")+(out?"":'<div class="qty"><button data-a="m" data-id="'+p.id+'" aria-label="Remover">−</button><b>'+q+'</b><button data-a="p" data-id="'+p.id+'" aria-label="Adicionar">+</button></div>')+'</div>'}
function catPage(g){return GROUP[g].map(function(c){return '<h2 class="sec">'+CATS[c].e+' '+CATS[c].t+'</h2><div class="grid asym">'+Object.keys(PROD).filter(function(k){return PROD[k].cat===c}).map(function(k){return card(PROD[k])}).join("")+'</div>'}).join("")+(count()?'<p style="text-align:center;margin-top:24px"><a class="btn" href="#carrinho">Ver carrinho ('+count()+')</a></p>':"")}

function inicio(){return '<section class="hero"><canvas id="sp"></canvas><div><h1>'+words("Doce que abraça, crocante que conquista")+'</h1><p class="muted rv">Copos da felicidade, vulcões, brownies e coxinhas artesanais, entregues na sua porta.</p><a class="btn" href="#copos">Ver cardápio</a></div>'+mas("hm")+'</section><p class="fill" id="fl">'+fillw("Cada copo, cada vulcão e cada coxinha sai da nossa cozinha artesanal com muito carinho.")+'</p><h2 class="sec rv">Escolha seu mimo</h2><div class="grid asym">'+
 Object.keys(GROUP).map(function(g){var c=GROUP[g][0];return '<a class="card tile rv" href="#'+g+'"><div class="ph">'+CATS[c].e+'</div><h3>'+PAGES[g]+'</h3></a>'}).join("")+
 '</div><h2 class="sec rv">Como pedir</h2><div class="grid asym">'+["Crie sua conta","Escolha os produtos","Informe o endereço e pague","Confirmamos pelo ZAP"].map(function(t,i){return '<div class="card rv"><b class="price">'+(i+1)+'</b><h3>'+t+'</h3></div>'}).join("")+'</div>'}

function carrinho(){var l=items();if(!l.length)return '<h2>Seu carrinho</h2><div class="card">Está vazio por enquanto 🧁<p><a class="btn" href="#copos">Escolher produtos</a></p></div>';
 return '<h2>Seu carrinho</h2><div class="card">'+l.map(function(i){return '<div class="line"><span>'+i.q+'× '+esc(i.p.nome)+' <span class="muted">('+CATS[i.p.cat].t+')</span></span><span><button class="btn alt" data-a="m" data-id="'+i.p.id+'">−</button> <button class="btn alt" data-a="p" data-id="'+i.p.id+'">+</button></span></div>'}).join("")+'<div class="line"><b>Total</b><b class="price">'+totTxt()+'</b></div></div><p><a class="btn" href="#finalizar">Finalizar pedido</a></p>'}

function conta(){var u=user||{};var h=(flash?'<div class="note">'+flash+'</div>':"")+(user?'<div class="note">Olá, <b>'+esc(u.nome)+'</b>! Sua conta está ativa neste aparelho.</div>':"");flash="";
 return '<h2>'+(user?"Minha conta":"Criar conta")+'</h2>'+h+'<form class="card" id="fc" novalidate><label>Nome</label><input name="nome" value="'+esc(u.nome||"")+'" autocomplete="name"><div class="row"><div><label>Número do ZAP</label><input name="zap" inputmode="tel" placeholder="(81) 90000-0000" value="'+esc(u.zap||"")+'"></div><div><label>Telefone</label><input name="tel" inputmode="tel" value="'+esc(u.tel||"")+'"></div></div><label>Gmail</label><input name="email" type="email" placeholder="voce@gmail.com" value="'+esc(u.email||"")+'"><h3 class="sec">Endereço de entrega</h3>'+adr(u)+'<p class="err" id="er"></p><button class="btn" type="submit">'+(user?"Salvar":"Criar conta")+'</button>'+(user?' <button class="btn alt" type="button" data-a="out">Sair</button>':"")+'</form>'}

function finalizar(){if(!items().length){location.hash="carrinho";return""}if(!user)return '<h2>Quase lá!</h2><div class="note">Para pedir, crie sua conta com ZAP, Gmail e telefone.</div><a class="btn" href="#conta">Criar conta</a>';
 return '<h2>Entrega e pagamento</h2><form class="card" id="ff" novalidate><h3>Como você quer receber?</h3><div class="pay"><label><input type="radio" name="tp" value="Entrega" checked>🛵 Entrega</label><label><input type="radio" name="tp" value="Retirada">🏪 Retirar no local</label></div><div id="ad"><h3 class="sec">Endereço de entrega</h3>'+adr(user)+'</div><div class="note" id="rt" hidden>Combinamos o local e o horário da retirada pelo ZAP.</div><h3 class="sec">Forma de pagamento</h3><div class="pay"><label><input type="radio" name="pg" value="Pix" checked>💠 Pix</label><label><input type="radio" name="pg" value="Cartão">💳 Cartão (maquininha)</label></div><div class="note" id="pgi"></div><div class="line"><b>Total</b><b class="price">'+totTxt()+'</b></div><p class="err" id="er"></p><button class="btn" type="submit">Confirmar pedido</button></form>'}
function pgInfo(){var el=document.getElementById("pgi");if(!el)return;var tp=document.querySelector('input[name=tp]:checked').value;document.getElementById("ad").hidden=tp==="Retirada";document.getElementById("rt").hidden=tp!=="Retirada";var v=document.querySelector('input[name=pg]:checked').value;el.innerHTML=v==="Pix"?(PIX?'Chave Pix: <b>'+esc(PIX)+'</b> <button type="button" class="btn alt" data-a="cp">Copiar</button><br>Pague e depois toque em confirmar.':'⚠️ A chave Pix da loja ainda não foi configurada.'):'Pague com cartão na maquininha '+(tp==="Retirada"?"na retirada":"na entrega")+'. Ao confirmar, avisamos a loja pelo ZAP.'}
