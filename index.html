function sprinkles(cv){var x=cv.getContext("2d"),W,H,P=[],m={x:-999,y:-999},C=["#ff4f9a","#ffb347","#e11d48","#7ad7c1","#b388ff","#ff8fb8"],h=cv.parentNode,r=cv.getBoundingClientRect();W=cv.width=r.width;H=cv.height=r.height;
